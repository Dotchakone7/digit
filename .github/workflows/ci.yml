name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: pgsql
            port: 5432
          - db: mariadb
            port: 3306
    name: tests (${{ matrix.db }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: digit
          POSTGRES_PASSWORD: digit
          POSTGRES_DB: digit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U digit" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: digit
          MARIADB_PASSWORD: digit
          MARIADB_DATABASE: digit_test
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_mysql, gd, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (${{ matrix.db }})
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: digit_test
          DB_USERNAME: digit
          DB_PASSWORD: digit
        run: php artisan test
