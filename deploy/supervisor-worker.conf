; /etc/supervisor/conf.d/boutique-worker.conf
; Traite les e-mails et notifications en arrière-plan, redémarre tout seul en cas d'arrêt.
[program:boutique-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/boutique/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/boutique/current/storage/logs/worker.log
stopwaitsecs=3600
