# /etc/nginx/sites-available/boutique — remplacer DOMAINE et le chemin si besoin.
# Certbot ajoutera automatiquement la partie HTTPS (listen 443 + certificats).
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE www.DOMAINE;

    root /var/www/boutique/current/public;
    index index.php;
    charset utf-8;

    # Taille maximale des uploads (images produits) — garder > SHOP_UPLOAD_MAX_KB.
    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fichiers compilés par Vite et images : mis en cache longtemps par les navigateurs.
    location ~* ^/(build|storage)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Aucun autre fichier PHP ni fichier caché (.env, .git…) n'est accessible.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
